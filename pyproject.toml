[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sessions"
version = "0.1.0"
description = "Local session discovery and messaging for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2,<3; python_version < '3.11'"]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agent-sessions = "agent_sessions:main"

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "build>=1.2,<2"]

[tool.setuptools]
py-modules = ["agent_sessions", "session_profiles", "managed_runs", "resource_broker", "resource_client"]

[tool.ruff]
line-length = 100
target-version = "py39"
