[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sessions"
version = "0.4.0"
description = "Local session discovery and messaging for Codex, Claude Code, Antigravity, and OpenCode"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2,<3; python_version < '3.11'"]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agent-sessions = "agent_sessions.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "build>=1.2,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["E402"]
"examples/**.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
