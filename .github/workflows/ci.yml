name: CI

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests
      - run: python -m scripts.docs.build
      - run: python -m scripts.docs.verify
      - run: python -m build
